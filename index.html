<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ultimate Surprise for Ms Baby</title>
<style>
:root{--bg:#08070b;--panel:#14111a;--text:#fff8f7;--muted:#c9bec7;--accent:#ff5f87;--accent2:#ffb75e;--good:#66e29a;--bad:#ff6b6b;--line:#342a39}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,rgba(255,95,135,.16),transparent 38%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(720px,100%);margin:0 auto;min-height:100vh;padding:24px 18px 40px;display:flex;flex-direction:column;justify-content:center}
.scene{display:none;opacity:0;transform:translateY(8px)}
.scene.show{display:block;animation:fadeIn .65s ease forwards}
@keyframes fadeIn{to{opacity:1;transform:none}}
.center{text-align:center}.year{font-size:clamp(3rem,16vw,6rem);font-weight:800;letter-spacing:-.06em}.small{color:var(--muted);font-size:.95rem}.title{font-size:clamp(2rem,8vw,4rem);line-height:1.02;margin:0 0 12px}.subtitle{color:var(--muted);font-size:1.05rem;line-height:1.55}
.card{background:rgba(20,17,26,.92);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:18px}
.btn{width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:1.05rem;font-weight:750;cursor:pointer;margin-top:12px;color:#171016;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.btn.secondary{color:var(--text);background:#241d29;border:1px solid #43354b}.btn.accept{background:linear-gradient(135deg,#6de5a0,#63d9ff)}.btn.decline{background:linear-gradient(135deg,#ff7a7a,#a96cff);color:white}.btn:disabled{opacity:.48;cursor:not-allowed}
.progress{height:12px;border-radius:999px;background:#251f2a;overflow:hidden;border:1px solid #3b3041;margin:14px 0}.progress>div{width:0%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{background:#0e0c11;border:1px solid #302735;border-radius:16px;padding:14px}.metric b{display:block;margin-top:4px;font-size:1.35rem}
.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #423349;border-radius:999px;padding:7px 10px;color:var(--muted);font-size:.9rem}.good{color:var(--good)}.bad{color:var(--bad)}
.task{font-size:.9rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent2);font-weight:800}.bigEmoji{font-size:4.5rem;margin:16px 0}.message{white-space:pre-line;font-size:1.03rem;line-height:1.7;text-align:left}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;color:#9e929f;max-height:120px;overflow:auto;margin-top:14px;padding-top:12px;border-top:1px solid #2d2631}
.loadingTrack{width:min(420px,100%);height:10px;margin:22px auto 0;background:#26212a;border-radius:999px;overflow:hidden}.loadingTrack>div{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .7s ease}
@media(max-width:520px){.row,.metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section id="intro" class="scene show center"><div id="year" class="year">2023...</div><div class="loadingTrack"><div id="introBar"></div></div><p id="introPct" class="small">25%</p></section>
<section id="menu" class="scene center"><h1 class="title">Ultimate Surprise for Ms Baby 🔥🔥</h1><p class="subtitle">One final mission. One ultimate surprise.</p><div id="connectionBadge" class="badge">Not connected</div>
<button id="playBtn" class="btn">Click to Play</button>
<p class="small">Tapping Play will ask you to connect to the handheld device.</p><p class="small">Game build: V3</p>
<div id="connectError" class="card" style="display:none;text-align:left"></div></section>
<section id="game" class="scene"><div id="gameContent"></div><div id="debugLog" class="log"></div></section>
</main>
<script>
const SERVICE_UUID='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_UUID='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const TX_UUID='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let device,server,rxChar,txChar,rxBuffer='',connected=false,mountainRetries=0;
let pendingIntensity=null;
let waitingForIntensityNext=false;

// Robust command/ack state for mobile Web Bluetooth.
let pendingScanStart=null;
let scanStartAttempt=0;
let scanStartTimer=null;
let lastCommandAck='';
const intro=document.getElementById('intro'),menu=document.getElementById('menu'),game=document.getElementById('game'),gameContent=document.getElementById('gameContent'),debugLog=document.getElementById('debugLog'),playBtn=document.getElementById('playBtn'),connectionBadge=document.getElementById('connectionBadge'),connectError=document.getElementById('connectError');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showOnly(el){[intro,menu,game].forEach(x=>x.classList.remove('show'));setTimeout(()=>el.classList.add('show'),30)}
async function playIntro(){showOnly(intro);const y=document.getElementById('year'),b=document.getElementById('introBar'),p=document.getElementById('introPct');for(const [label,v] of [['2023...',25],['2024...',50],['2025...',75],['2026 ✓',100]]){y.style.opacity=0;await sleep(280);y.textContent=label;b.style.width=v+'%';p.textContent=v+'%';y.style.opacity=1;await sleep(900)}y.style.opacity=0;await sleep(400);y.textContent='2027...???';p.textContent='Unknown';y.style.opacity=1;await sleep(1350);showOnly(menu)}
function log(msg){const d=document.createElement('div');d.textContent=msg;debugLog.appendChild(d);debugLog.scrollTop=debugLog.scrollHeight}
function setConnection(text,ok=false){connectionBadge.textContent=text;connectionBadge.className='badge '+(ok?'good':'')}
async function connectBLE(){
  if(connected)return;

  connectError.style.display='none';
  connectError.innerHTML='';

  if(!window.isSecureContext){
    throw new Error('This page is not running in a secure HTTPS context.');
  }

  if(!navigator.bluetooth){
    throw new Error('This browser does not support Web Bluetooth. On Android use Chrome. On iPhone, Safari will not work; open this page in a Web Bluetooth browser such as Bluefy.');
  }

  device=await navigator.bluetooth.requestDevice({
    acceptAllDevices:true,
    optionalServices:[SERVICE_UUID]
  });

  device.addEventListener('gattserverdisconnected',()=>{
    connected=false;
    clearScanStartRetry();
    setConnection('Disconnected');
  });

  server=await device.gatt.connect();

  const service=await server.getPrimaryService(SERVICE_UUID);
  rxChar=await service.getCharacteristic(RX_UUID);
  txChar=await service.getCharacteristic(TX_UUID);

  await txChar.startNotifications();
  txChar.addEventListener('characteristicvaluechanged',onBLEData);

  connected=true;
  setConnection('Handheld connected ✓',true);

  await sendCommand('PING');
  await sendCommand('STATUS');
}
async function sendCommand(cmd){
  if(!connected||!rxChar){
    throw new Error('Bluetooth is not connected.');
  }

  // Send the exact ASCII command with no newline required.
  // Firmware V3 recognizes a complete command immediately.
  const data=new TextEncoder().encode(cmd);

  // Prefer an acknowledged GATT write. This is more reliable in
  // iPhone Web-Bluetooth wrapper browsers than fire-and-forget writes.
  if(typeof rxChar.writeValueWithResponse==='function'){
    await rxChar.writeValueWithResponse(data);
  }else if(typeof rxChar.writeValue==='function'){
    await rxChar.writeValue(data);
  }else if(typeof rxChar.writeValueWithoutResponse==='function'){
    await rxChar.writeValueWithoutResponse(data);
  }else{
    throw new Error('This browser cannot write to the Bluetooth characteristic.');
  }

  log('> '+cmd);
}
function onBLEData(event){rxBuffer+=new TextDecoder().decode(event.target.value);let i;while((i=rxBuffer.indexOf('\n'))>=0){const line=rxBuffer.slice(0,i).trim();rxBuffer=rxBuffer.slice(i+1);if(line){log('< '+line);handleMessage(line)}}}
function panel(html){gameContent.innerHTML='<div class="card">'+html+'</div>'}function taskHeader(n,title){return `<div class="task">Task ${n} of 4</div><h2>${title}</h2>`}
function showInstructions(){
  showOnly(game);
  panel(`${taskHeader(1,'Biometric Baseline')}
    <p class="subtitle">Hold the handheld device with one thumb resting steadily on the heart-rate sensor and the other thumb resting on the temperature sensor.</p>
    <p>Keep both thumbs in place for the full <b>30 seconds</b>.</p>
    <button id="baselineBtn" class="btn">Begin 30-Second Scan</button>
    <p class="small">The scan will start as soon as the handheld confirms the command.</p>
  `);

  document.getElementById('baselineBtn').addEventListener('click',()=>{
    beginScanReliably('BASELINE','START_BASELINE');
  });
}

function showStartingScan(kind){
  const names={
    BASELINE:'Baseline Scan',
    PUSHUPS:'Post-Pushup Scan',
    MOUNTAIN:'Post-Mountain-Climber Scan'
  };
  panel(`
    <div class="task">${names[kind]||'Biometric Scan'}</div>
    <h2>Starting sensor scan...</h2>
    <p class="subtitle">Keep both thumbs in position. Confirming the handheld connection.</p>
    <div class="progress"><div style="width:4%"></div></div>
    <p class="small" id="startAttemptText">Sending command...</p>
  `);
}

function clearScanStartRetry(){
  if(scanStartTimer){
    clearTimeout(scanStartTimer);
    scanStartTimer=null;
  }
  pendingScanStart=null;
  scanStartAttempt=0;
}

async function beginScanReliably(kind,command){
  clearScanStartRetry();
  pendingScanStart={kind,command};
  scanStartAttempt=0;
  showStartingScan(kind);
  await sendScanStartAttempt();
}

async function sendScanStartAttempt(){
  if(!pendingScanStart)return;

  scanStartAttempt++;

  const t=document.getElementById('startAttemptText');
  if(t)t.textContent=`Connecting to sensors… attempt ${scanStartAttempt} of 3`;

  try{
    await sendCommand(pendingScanStart.command);
  }catch(err){
    showScanStartFailure(err.message||String(err));
    return;
  }

  // If SCAN_STARTED was lost, repeat the same command.
  // Firmware does NOT restart an already-running same-kind scan;
  // it simply resends SCAN_STARTED.
  scanStartTimer=setTimeout(async()=>{
    if(!pendingScanStart)return;

    if(scanStartAttempt<3){
      await sendScanStartAttempt();
    }else{
      showScanStartFailure(
        'The handheld did not confirm the scan. Keep it powered, reconnect Bluetooth, and try again.'
      );
    }
  },1600);
}

function showScanStartFailure(message){
  clearScanStartRetry();
  panel(`
    <div class="task">Connection Check</div>
    <h2>Scan did not start</h2>
    <p class="subtitle">${message}</p>
    <button id="returnTask1" class="btn">Return to Task 1</button>
  `);
  document.getElementById('returnTask1').addEventListener('click',showInstructions);
}
function showScan(kind,pct,bpm,temp,finger,secondsRemaining=30){
  const names={
    BASELINE:'Baseline Scan',
    PUSHUPS:'Post-Pushup Scan',
    MOUNTAIN:'Post-Mountain-Climber Scan'
  };

  const hrText=(finger && bpm>0)?Math.round(bpm)+' BPM':'Reading...';
  const tempText=temp>0?Number(temp).toFixed(2)+' °C':'Reading...';
  const seconds=Math.max(0,Number(secondsRemaining)||0);

  panel(`
    <div class="task">${names[kind]||'Biometric Scan'}</div>
    <h2>Hold steady...</h2>

    <div class="progress">
      <div style="width:${Math.max(0,Math.min(100,pct))}%"></div>
    </div>

    <p class="small">
      ${pct}% complete · <b>${seconds} second${seconds===1?'':'s'} remaining</b>
    </p>

    <div class="metrics">
      <div class="metric">
        <span>Live Heart Rate</span>
        <b>${hrText}</b>
      </div>
      <div class="metric">
        <span>Live Temperature</span>
        <b>${tempText}</b>
      </div>
    </div>

    <p class="${finger?'good':'small'}">
      ${finger?'Heart sensor contact detected ✓':'Keep your thumb steady on the heart-rate sensor.'}
    </p>

    <p class="small">
      Final averages unlock after the full 30-second scan.
    </p>
  `);
}

function showScanComplete(kind,result){
  const titles={
    BASELINE:'Baseline Captured ✓',
    PUSHUPS:'Post-Pushup Reading Captured ✓',
    MOUNTAIN:'Final Biometric Reading Captured ✓'
  };

  const nextLabels={
    BASELINE:'Next — 10 Pushups',
    PUSHUPS:'Next — 50 Mountain Climbers',
    MOUNTAIN:'Next — Check Results'
  };

  panel(`
    <div class="task">30-Second Scan Complete</div>
    <h2>${titles[kind]||'Reading Captured ✓'}</h2>

    <div class="progress">
      <div style="width:100%"></div>
    </div>

    <p class="good">100% complete ✓</p>

    <div class="metrics">
      <div class="metric">
        <span>30-Second Average BPM</span>
        <b>${result.bpm.toFixed(1)} BPM</b>
      </div>
      <div class="metric">
        <span>30-Second Average Temperature</span>
        <b>${result.temp.toFixed(2)} °C</b>
      </div>
    </div>

    <button id="scanNextBtn" class="btn">${nextLabels[kind]||'Next'}</button>
  `);

  document.getElementById('scanNextBtn').addEventListener('click',()=>{
    if(kind==='BASELINE'){
      showPushups();
      return;
    }

    if(kind==='PUSHUPS'){
      showMountain();
      return;
    }

    if(kind==='MOUNTAIN'){
      if(pendingIntensity){
        const r=pendingIntensity;
        pendingIntensity=null;
        waitingForIntensityNext=false;
        showIntensityResult(r.pass,r.hrPct,r.tempPct,r.hrPass,r.tempPass);
      }else{
        waitingForIntensityNext=true;
        const b=document.getElementById('scanNextBtn');
        if(b){
          b.disabled=true;
          b.textContent='Checking Results...';
        }
      }
    }
  });
}

function showPushups(){panel(`${taskHeader(2,'Strength Check')}<h2>10 Pushups</h2><p class="subtitle">Complete 10 controlled pushups. Put the handheld somewhere safe while you do them.</p><button id="pushDone" class="btn">I Finished 10 Pushups</button>`);document.getElementById('pushDone').addEventListener('click',()=>{panel(`${taskHeader(2,'Post-Pushup Scan')}<p>Put both thumbs back on the sensors and hold steady for 30 seconds.</p><button id="pushScan" class="btn">Start 30-Second Scan</button>`);document.getElementById('pushScan').addEventListener('click',()=>beginScanReliably('PUSHUPS','START_POST_PUSHUPS'))})}
function showMountain(){panel(`${taskHeader(3,'Energy Challenge')}<h2>50 Mountain Climbers</h2><p class="subtitle">Complete 50 mountain climbers at a comfortable but purposeful pace. The biometric scan afterward checks your response.</p><button id="mountDone" class="btn">I Finished 50 Mountain Climbers</button>`);document.getElementById('mountDone').addEventListener('click',()=>{panel(`${taskHeader(3,'Final Biometric Check')}<p>Return both thumbs to the sensors and hold still for 30 seconds.</p><button id="mountScan" class="btn">Start 30-Second Scan</button>`);document.getElementById('mountScan').addEventListener('click',()=>beginScanReliably('MOUNTAIN','START_POST_MOUNTAIN'))})}
function showIntensityResult(pass,hrPct,tempPct,hrPass,tempPass){if(pass){panel(`${taskHeader(3,'Energy Verified ✓')}<div class="metrics"><div class="metric"><span>Heart-rate change</span><b class="${hrPass?'good':'bad'}">${hrPct>=0?'+':''}${hrPct.toFixed(1)}%</b></div><div class="metric"><span>Temperature change</span><b class="${tempPass?'good':'bad'}">${tempPct>=0?'+':''}${tempPct.toFixed(1)}%</b></div></div><p class="subtitle">Challenge cleared. Final navigation task unlocked.</p><button id="lungeInfo" class="btn">Continue</button>`);document.getElementById('lungeInfo').addEventListener('click',showLungeInstructions)}else{mountainRetries++;const canRetry=mountainRetries<=1;panel(`${taskHeader(3,'Almost There')}<div class="metrics"><div class="metric"><span>Heart-rate change</span><b>${hrPct>=0?'+':''}${hrPct.toFixed(1)}%</b></div><div class="metric"><span>Temperature change</span><b>${tempPct>=0?'+':''}${tempPct.toFixed(1)}%</b></div></div><p class="subtitle">The heart-rate target was not detected clearly. ${canRetry?'You can retry the mountain-climber round once after you feel ready.':'Continue to the final task.'}</p>${canRetry?'<button id="retryMount" class="btn">Retry Mountain Climbers Once</button>':'<button id="continueLunge" class="btn">Continue</button>'}`);if(canRetry)document.getElementById('retryMount').addEventListener('click',showMountain);else document.getElementById('continueLunge').addEventListener('click',showLungeInstructions)}}
function showLungeInstructions(){panel(`${taskHeader(4,'Final Navigation Challenge')}<h2>Walking Lunges: 5 m Out + 5 m Back</h2><p class="subtitle">Mark a 5-meter line on the floor. Hold the handheld roughly flat at chest level. Lunge to the mark, turn around while still holding it, then lunge back home.</p><p class="small">The MPU6050 verifies movement and the turnaround. The physical floor mark defines the actual 5 m distance.</p><button id="startLunge" class="btn">Start Lunge Challenge</button>`);document.getElementById('startLunge').addEventListener('click',()=>sendCommand('START_LUNGES'))}
function showLungeProgress(pct,outCount,backCount,turned){panel(`${taskHeader(4,'Final Navigation Challenge')}<h2>${turned?'Return Home':'Move to the 5 m Mark'}</h2><div class="progress"><div style="width:${pct}%"></div></div><p class="small">${pct}% verified</p><div class="metrics"><div class="metric"><span>Outbound movement</span><b>${outCount}</b></div><div class="metric"><span>Return movement</span><b>${backCount}</b></div></div><p class="${turned?'good':'small'}">${turned?'Turnaround detected ✓':'At the mark, make a clear 180° turn.'}</p>`)}
function showSurprisePrompt(){panel(`<div class="task">All Tasks Complete</div><h2>Would you like the surprise?</h2><p class="subtitle">You earned the final reveal.</p><button id="revealBtn" class="btn">Yes — Show Me the Surprise</button>`);document.getElementById('revealBtn').addEventListener('click',showFinalMessage)}
function showFinalMessage(){const message=`Congratulations on completing the tasks! You never fail to inspire. Your impact is everything. From motivating me out of dark times and keeping me going in life, I truly believe you deserve this. You mean everything to me. You've been the best person in the world.\n\nPlease allow me to take you on a vacation to Cancun, Mexico at The Reef Playcar from January 18 - January 23, 2027 Mi Reina ❤️`;panel(`<div class="task">Ultimate Surprise Unlocked</div><h2>For Ms Baby ❤️</h2><div class="message">${message}</div><div class="row"><button id="acceptBtn" class="btn accept">Accept ❤️</button><button id="declineBtn" class="btn decline">Decline</button></div>`);document.getElementById('acceptBtn').addEventListener('click',()=>{sendCommand('ACCEPT');showEnding(true)});document.getElementById('declineBtn').addEventListener('click',()=>{sendCommand('DECLINE');showEnding(false)})}
function showEnding(accepted){panel(`<div class="center"><div class="bigEmoji">${accepted?'🥳🎉💖':'😢💩'}</div><h2>${accepted?'CANCUN 2027!!!':'Declined 😭'}</h2><p class="subtitle">${accepted?'Mi Reina said yes ❤️':'The mission has suffered an emotional defeat.'}</p><div id="restartHolder"><p class="small">Restart option unlocking...</p></div></div>`);setTimeout(()=>{const h=document.getElementById('restartHolder');if(!h)return;h.innerHTML='<button id="restartBtn" class="btn secondary">Restart Game</button>';document.getElementById('restartBtn').addEventListener('click',restartEverything)},3000)}
async function restartEverything(){
  mountainRetries=0;
  pendingIntensity=null;
  waitingForIntensityNext=false;
  if(connected)await sendCommand('RESTART');
  await playIntro();
}
function handleMessage(line){const p=line.split(','),type=p[0];if(type==='STATUS'){const ok=p[1]==='1'&&p[2]==='1'&&p[3]==='1';if(!ok)alert(`Sensor check failed.\nMAX30102: ${p[1]==='1'?'OK':'ERROR'}\nMCP9808: ${p[2]==='1'?'OK':'ERROR'}\nMPU6050: ${p[3]==='1'?'OK':'ERROR'}`)}
if(type==='COMMAND_ACK'){
  lastCommandAck=p.slice(1).join(',');
}
if(type==='PONG'){
  log('< Bluetooth command channel verified');
}
if(type==='SCAN_STARTED'){
  clearScanStartRetry();
  showScan(p[1],0,0,0,false,30);
}
if(type==='SCAN_PROGRESS'){
  const remaining=(p.length>6)?Number(p[6]):Math.max(0,Math.ceil(30*(1-Number(p[2])/100)));
  showScan(
    p[1],
    Number(p[2]),
    Number(p[3]),
    Number(p[4]),
    p[5]==='1',
    remaining
  );
}
if(type==='SCAN_RETRY'){
  panel(`<h2>Let's redo that reading</h2><p class="subtitle">The sensor signal was not steady enough for a reliable 30-second average. Keep both thumbs steady on the sensors.</p><button id="retryScan" class="btn">Retry 30-Second Scan</button>`);
  document.getElementById('retryScan').addEventListener('click',()=>{
    const k=p[1];
    const cmd=k==='BASELINE'?'START_BASELINE':k==='PUSHUPS'?'START_POST_PUSHUPS':'START_POST_MOUNTAIN';
    beginScanReliably(k,cmd);
  });
}
if(type==='SCAN_DONE'){
  const kind=p[1];
  const r={bpm:Number(p[2]),temp:Number(p[3])};
  showScanComplete(kind,r);
}
if(type==='INTENSITY'){
  pendingIntensity={
    pass:p[1]==='PASS',
    hrPct:Number(p[2]),
    tempPct:Number(p[3]),
    hrPass:p[4]==='1',
    tempPass:p[5]==='1'
  };

  if(waitingForIntensityNext){
    const r=pendingIntensity;
    pendingIntensity=null;
    waitingForIntensityNext=false;
    showIntensityResult(r.pass,r.hrPct,r.tempPct,r.hrPass,r.tempPass);
  }
}
if(type==='LUNGE_STARTED')showLungeProgress(0,0,0,false);
if(type==='LUNGE_PROGRESS')showLungeProgress(Number(p[1]),Number(p[2]),Number(p[3]),p[4]==='1');
if(type==='LUNGE_DONE'){panel(`<h2>Navigation Complete ✓</h2><p class="subtitle">Home position verified.</p>`);setTimeout(showSurprisePrompt,1500)}
if(type==='LUNGE_TIMEOUT'){panel(`<h2>Motion tracking timed out</h2><p class="subtitle">Try the 5 m out-and-back course again, holding the device flat enough to detect the turn.</p><button id="retryLunge" class="btn">Retry Lunges</button>`);document.getElementById('retryLunge').addEventListener('click',()=>sendCommand('START_LUNGES'))}
if(type==='ERROR'){
  const code=p[1]||'UNKNOWN';
  clearScanStartRetry();

  if(code==='BIOMETRIC_SENSOR'){
    panel(`
      <div class="task">Sensor Check</div>
      <h2>A biometric sensor is not ready</h2>
      <p class="subtitle">The MAX30102 or MCP9808 did not initialize correctly. Check the sensor wiring, then reset the Feather and reconnect.</p>
      <button id="sensorRetryBtn" class="btn">Return to Task 1</button>
    `);
    document.getElementById('sensorRetryBtn').addEventListener('click',showInstructions);
  }else{
    alert('Device error: '+p.slice(1).join(' '));
  }
}}
playBtn.addEventListener('click',async()=>{
  playBtn.disabled=true;
  playBtn.textContent='Connecting...';
  connectError.style.display='none';
  try{
    await connectBLE();
    showInstructions();
  }catch(err){
    console.error(err);
    connectError.style.display='block';
    connectError.innerHTML='<b class="bad">Bluetooth connection failed</b><p class="small">'+
      String(err.name||'Error')+': '+String(err.message||err)+'</p>'+
      '<p class="small">Keep the Feather powered and advertising as ULTIMATE-SURPRISE, then try again.</p>';
  }finally{
    playBtn.disabled=false;
    playBtn.textContent='Click to Play';
  }
});
playIntro();
</script>
</body>
</html>
